    "numpy<2",
    "pandas",
    "torch<=2.2.2",
    "torchaudio<=2.2.2",
    "torchvision<=0.17.2",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pydeps>=3.0.9",
]
